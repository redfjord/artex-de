name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  translation-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Run the translation verification
        run: ./verify/run-verification.sh

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: regression-fixture
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ARTEX_TEST_ADMIN_DSN: postgres://artex:regression-fixture@127.0.0.1:5432/artex?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Test entrypoint shutdown and restart handling
        run: python3 -m unittest discover -s tests -p test_start.py -v
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Test api-recon dependency preflight
        run: python3 -m unittest discover -s tests -p test_api_recon_runtime.py -v
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true
      - run: go vet ./...
      - name: Run every Go test with fresh PostgreSQL state
        run: python3 ci/go-tests-isolated.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-regression-results
          path: artifacts/go-tests
      - name: Benchmark worker prompt assembly
        run: go test ./agent -run '^$' -bench BenchmarkWorkerPromptAssembly -benchmem -count 5

  web-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: e2e-fixture
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ARTEX_PG_DSN: postgres://artex:e2e-fixture@127.0.0.1:5432/artex?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build the web console
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build:static
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true
      - name: Build the single binary with the embedded UI
        run: |
          rm -rf server/webui/dist
          mkdir -p server/webui/dist
          cp -R web/out/. server/webui/dist/
          go build -trimpath -buildvcs=false -tags embedui -o /tmp/artex ./cmd/artex
      - name: End-to-end check of the built binary
        run: python3 ci/e2e_binary.py /tmp/artex

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: integration-fixture
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ARTEX_PG_DSN: postgres://artex:integration-fixture@127.0.0.1:5432/artex?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true
      - name: Test prompt ordering and runtime controls against fresh PostgreSQL
        run: >-
          go test -count=1 ./server -run
          'TestDeferredHostToolsOrderDeterministic|TestOnlineUpdateDisabledForEveryVersion|TestReleaseCache|TestCoreTaskLifecyclePG|TestAuthStatusFailsClosedWhenDataSourceUnavailable|TestAuthInitFailsClosedWhenDataSourceUnavailable'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test verification failure handling
        run: sh tests/verify.sh

      - uses: docker/setup-buildx-action@v3

      - name: Build safe image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.safe
          platforms: linux/amd64
          load: true
          tags: artex-de:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify implant indicators and runtime user
        run: make verify IMAGE=artex-de:ci

      - name: Verify api-recon preinstalled runtime
        run: |
          docker run --rm --network none --shm-size=1g -v "$PWD/ci:/ci:ro" \
            --entrypoint node artex-de:ci /ci/api-recon-smoke.js

      - name: Boot and exercise the full image on an internal network
        run: python3 ci/runtime_smoke.py artex-de:ci

      - name: Record image digest
        run: docker image inspect artex-de:ci --format '{{.Id}}' | tee image-id.txt

      - uses: actions/upload-artifact@v4
        with:
          name: image-id
          path: image-id.txt
